<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Quist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/auth.css">
</head>
<body>
<div class="wrap">
  <form class="card" data-mode="login" autocomplete="on">
    <div class="brand"><div class="dot"><i></i></div><span>cloud coding unit</span></div>
    <div class="kicker">sign in</div>
    <h1>Open your workspace</h1>
    <p class="sub">Your projects live here, not on this machine. Sign in from any computer and the same graph is waiting.</p>
    <input name="email" type="email" placeholder="you@example.com" autocomplete="email" required spellcheck="false">
    <input name="password" type="password" placeholder="password" autocomplete="current-password" required>
    <div class="err"></div>
    <button type="submit">Sign in</button>
    <div class="foot">No account yet? <a href="/signup">Create one</a></div>
  </form>
</div>
<script src="/auth.js"></script>
</body>
</html>
