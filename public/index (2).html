<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concord</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- ═══ AUTH ═══ -->
<div id="auth-screen" class="screen active">
    <div class="auth-bg">
        <div class="auth-orb auth-orb-1"></div>
        <div class="auth-orb auth-orb-2"></div>
        <div class="auth-orb auth-orb-3"></div>
    </div>
    <div class="auth-card">
        <div class="auth-logo">
            <svg width="44" height="34" viewBox="0 0 44 34" fill="none">
                <path d="M36.2 2.8C33.5 1.6 30.6 0.7 27.6 0.2c-0.4 0.7-0.8 1.5-1.1 2.3c-3.2-0.5-6.4-0.5-9.6 0c-0.3-0.8-0.7-1.6-1.1-2.3c-3 0.5-5.9 1.4-8.6 2.6C1.1 12.5-0.7 21.9 0.2 31.1c3.6 2.7 7.1 4.3 10.5 5.4c0.8-1.2 1.6-2.4 2.2-3.7c-1.2-0.5-2.4-1.1-3.5-1.8c0.3-0.2 0.6-0.4 0.9-0.7c7 3.3 14.6 3.3 21.5 0c0.3 0.2 0.6 0.5 0.9 0.7c-1.1 0.7-2.3 1.3-3.5 1.8c0.7 1.3 1.4 2.5 2.2 3.7c3.4-1.1 6.9-2.7 10.5-5.4C42.7 20.4 40.3 11.1 36.2 2.8zM14.7 25.5c-2.4 0-4.4-2.2-4.4-5s1.9-5 4.4-5s4.5 2.3 4.4 5S17.2 25.5 14.7 25.5zM29.3 25.5c-2.4 0-4.4-2.2-4.4-5s1.9-5 4.4-5s4.5 2.3 4.4 5S31.7 25.5 29.3 25.5z" fill="#5865F2"/>
            </svg>
            <h1>Concord</h1>
        </div>
        <p class="auth-sub">Your place to talk. Chat with your community.</p>

        <div class="auth-toggle">
            <button class="at-btn active" data-form="login">Login</button>
            <button class="at-btn" data-form="register">Register</button>
            <div class="at-slider"></div>
        </div>

        <form id="login-form" class="auth-form visible">
            <div class="field">
                <label>USERNAME</label>
                <input type="text" id="l-user" required autocomplete="username">
            </div>
            <div class="field">
                <label>PASSWORD</label>
                <input type="password" id="l-pass" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-primary">Log In</button>
            <p class="auth-err" id="l-err"></p>
        </form>

        <form id="register-form" class="auth-form">
            <div class="field">
                <label>DISPLAY NAME</label>
                <input type="text" id="r-name" required>
            </div>
            <div class="field">
                <label>USERNAME</label>
                <input type="text" id="r-user" required autocomplete="username">
            </div>
            <div class="field">
                <label>PASSWORD</label>
                <input type="password" id="r-pass" required minlength="6" autocomplete="new-password">
            </div>
            <button type="submit" class="btn-primary">Create Account</button>
            <p class="auth-err" id="r-err"></p>
        </form>
    </div>
</div>

<!-- ═══ MAIN APP ═══ -->
<div id="app-screen" class="screen">
    <!-- Server rail -->
    <nav id="server-rail">
        <div id="home-btn" class="rail-icon active" title="Direct Messages">
            <svg width="28" height="20" viewBox="0 0 44 34" fill="currentColor">
                <path d="M36.2 2.8C33.5 1.6 30.6 0.7 27.6 0.2c-0.4 0.7-0.8 1.5-1.1 2.3c-3.2-0.5-6.4-0.5-9.6 0c-0.3-0.8-0.7-1.6-1.1-2.3c-3 0.5-5.9 1.4-8.6 2.6C1.1 12.5-0.7 21.9 0.2 31.1c3.6 2.7 7.1 4.3 10.5 5.4c0.8-1.2 1.6-2.4 2.2-3.7c-1.2-0.5-2.4-1.1-3.5-1.8c0.3-0.2 0.6-0.4 0.9-0.7c7 3.3 14.6 3.3 21.5 0c0.3 0.2 0.6 0.5 0.9 0.7c-1.1 0.7-2.3 1.3-3.5 1.8c0.7 1.3 1.4 2.5 2.2 3.7c3.4-1.1 6.9-2.7 10.5-5.4C42.7 20.4 40.3 11.1 36.2 2.8zM14.7 25.5c-2.4 0-4.4-2.2-4.4-5s1.9-5 4.4-5s4.5 2.3 4.4 5S17.2 25.5 14.7 25.5zM29.3 25.5c-2.4 0-4.4-2.2-4.4-5s1.9-5 4.4-5s4.5 2.3 4.4 5S31.7 25.5 29.3 25.5z"/>
            </svg>
        </div>
        <div class="rail-sep"></div>
        <div id="server-list"></div>
        <div class="rail-icon add-server" id="btn-add-server" title="Add Server">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </div>
    </nav>

    <!-- Sidebar (changes based on context) -->
    <aside id="sidebar">
        <!-- DM Sidebar -->
        <div id="dm-sidebar" class="sidebar-panel active">
            <div class="sidebar-search">
                <input type="text" placeholder="Find or start a conversation" id="dm-search">
            </div>
            <div class="sidebar-nav">
                <div class="nav-item active" data-view="friends" id="nav-friends">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    Friends
                </div>
            </div>
            <div class="sidebar-label">
                DIRECT MESSAGES
                <button class="label-btn" id="btn-new-dm" title="New DM">+</button>
            </div>
            <div id="dm-list" class="sidebar-list"></div>
        </div>

        <!-- Server Sidebar -->
        <div id="server-sidebar" class="sidebar-panel">
            <div class="server-header" id="server-header">
                <span id="server-header-name"></span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
            </div>
            <div class="sidebar-list" id="channel-list"></div>
            <button class="btn-add-channel" id="btn-add-channel">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Create Channel
            </button>
        </div>

        <!-- User panel -->
        <div class="user-panel">
            <div class="user-panel-info">
                <div class="avatar-with-status">
                    <div class="avatar" id="my-avatar"></div>
                    <div class="status-dot" id="my-status-dot"></div>
                </div>
                <div class="user-panel-text">
                    <div class="user-panel-name" id="my-name"></div>
                    <div class="user-panel-tag" id="my-tag"></div>
                </div>
            </div>
            <div class="user-panel-btns">
                <button class="up-btn" id="btn-settings" title="Settings">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </button>
                <button class="up-btn" id="btn-logout" title="Log out">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </div>
    </aside>

    <!-- Main content area -->
    <main id="main">
        <!-- Header bar -->
        <header id="main-header">
            <div class="header-left">
                <span class="header-icon" id="header-icon"></span>
                <span class="header-title" id="header-title">Friends</span>
                <span class="header-topic" id="header-topic"></span>
            </div>
            <div class="header-actions">
                <button class="ha-btn" id="btn-invite-code" title="Invite Code" style="display:none">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
                </button>
                <button class="ha-btn" id="btn-toggle-members" title="Members" style="display:none">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                </button>
            </div>
        </header>

        <div id="main-body">
            <!-- Friends view -->
            <div id="friends-view" class="main-view active">
                <div class="friends-tabs">
                    <button class="ft-btn active" data-filter="all">All</button>
                    <button class="ft-btn" data-filter="online">Online</button>
                    <button class="ft-btn" data-filter="pending">Pending</button>
                    <button class="ft-btn ft-add" data-filter="add">Add Friend</button>
                </div>
                <div id="friends-content">
                    <div id="friends-list"></div>
                    <div id="add-friend-form" class="hidden">
                        <p>You can add friends with their username.</p>
                        <div class="add-friend-input">
                            <input type="text" id="add-friend-username" placeholder="Enter a username">
                            <button class="btn-primary btn-sm" id="btn-send-request">Send Request</button>
                        </div>
                        <p class="auth-err" id="friend-err"></p>
                    </div>
                </div>
            </div>

            <!-- Chat view (channels & DMs) -->
            <div id="chat-view" class="main-view">
                <div class="messages-wrap">
                    <div id="messages" class="messages"></div>
                </div>
                <div class="chat-bar">
                    <div class="chat-input-wrap">
                        <input type="text" id="msg-input" placeholder="Message #general" autocomplete="off">
                    </div>
                </div>
            </div>
        </div>

        <!-- Members panel (right sidebar) -->
        <div id="members-panel" class="hidden">
            <h3>Members</h3>
            <div id="members-list-panel"></div>
        </div>
    </main>
</div>

<!-- ═══ MODALS ═══ -->
<div id="modal-bg" class="modal-bg hidden" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-head">
            <h3 id="modal-title"></h3>
            <button class="modal-x" onclick="closeModal()">&times;</button>
        </div>
        <div id="modal-body"></div>
    </div>
</div>

<!-- Toast -->
<div id="toasts"></div>

<script src="/js/app.js"></script>
</body>
</html>
